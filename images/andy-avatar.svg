<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Andy Sin AS monogram in a Frutiger inspired water world</title>
  <desc id="desc">A glossy aqua and lime illustration with bubbles, hills, and the initials AS.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#98e6ff"/><stop offset=".52" stop-color="#2ec9de"/><stop offset="1" stop-color="#087fb6"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9ff85"/><stop offset="1" stop-color="#83cc40"/></linearGradient>
    <radialGradient id="orb" cx="30%" cy="18%" r="78%"><stop stop-color="#f7ffff"/><stop offset=".08" stop-color="#a8f4ff"/><stop offset=".48" stop-color="#21c9ed"/><stop offset=".78" stop-color="#087fb8"/><stop offset="1" stop-color="#064a89"/></radialGradient>
    <linearGradient id="orb-rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".98"/><stop offset=".6" stop-color="#9befff" stop-opacity=".7"/><stop offset="1" stop-color="#74c84d" stop-opacity=".62"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#075c90" flood-opacity=".25"/></filter>
  </defs>
  <rect width="720" height="720" rx="84" fill="url(#sky)"/>
  <circle cx="575" cy="134" r="87" fill="#fff" opacity=".87"/>
  <circle cx="601" cy="113" r="24" fill="#fff" opacity=".55"/>
  <circle cx="125" cy="154" r="38" fill="#fff" opacity=".55"/><circle cx="176" cy="99" r="17" fill="#fff" opacity=".72"/>
  <path d="M0 479C104 397 215 422 319 497c120 87 233 56 401-49v272H0z" fill="url(#hill)"/>
  <path d="M0 561c144-72 245-16 358 38 105 50 224 44 362-36v157H0z" fill="#57c3d5" opacity=".82"/>
  <circle cx="580" cy="468" r="42" fill="#fff" opacity=".32"/><circle cx="629" cy="414" r="18" fill="#fff" opacity=".5"/>
  <g filter="url(#shadow)">
